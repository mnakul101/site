title: "Momentum-Based Variance Reduced Algorithms for Imitation Learning"
degree: "M.Tech., Electrical Engineering (B.Tech.&ndash;M.Tech. Dual Degree)"
institution: "Indian Institute of Technology Kanpur"
institution_url: "https://iitk.ac.in/"
year: 2023
advisor: "Prof. Ketan Rajawat"
advisor_url: "https://home.iitk.ac.in/~ketan/"
lab: "Signal Processing in Networks (SPiN) Lab"
pdf: assets/files/Thesis.pdf

description: >-
  Imitation learning trains an agent to reproduce expert behaviour from demonstrations, but
  the stochastic gradient methods normally used to do so need a large number of expert queries
  before they converge. This thesis develops momentum-based variance reduced algorithms for
  the imitation learning problem, analyses their convergence in the Markov decision process
  setting, and shows empirically on OpenAI Gym environments that they reach comparable policies
  while making substantially fewer calls to the expert.
