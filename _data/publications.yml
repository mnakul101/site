# Publications, newest first.
#
# ANONYMITY: never name the venue a paper is under review at - write plain
# "Under review." Naming it can compromise double-blind review. Only name a
# venue once the paper is accepted or published.
#
# Fields:
#   title    (required)
#   authors  (required) - wrap your own name in <strong>...</strong>
#   venue    (required) - where it appeared / its current status
#   year     (optional) - shown in parentheses after the title
#   note     (optional) - highlighted in red, e.g. "Best Paper Award"
#   image    (optional) - path to a teaser image, e.g. assets/img/teaser.png
#   links    (optional) - list of { name, url } buttons

